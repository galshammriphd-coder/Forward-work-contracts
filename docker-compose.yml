services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: research_analytics
      POSTGRES_USER: ra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes: [pgdata:/var/lib/postgresql/data]
  app:
    build: .
    depends_on: [db]
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://ra:${POSTGRES_PASSWORD:-change-me}@db:5432/research_analytics
      RA_ENCRYPTION_KEY: ${RA_ENCRYPTION_KEY:?generate with: python -c "from cryptography.fernet import Fernet;print(Fernet.generate_key().decode())"}
      RA_ALLOW_REGISTRATION: "1"
    volumes: [files:/data]
volumes:
  pgdata:
  files:
